name: Test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt pytest
      - run: node --check dashboard/app.js
      - run: node --check dashboard/i18n.js
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
  linux-shutdown:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Stop with connected miners and dashboard streams
        run: >-
          python -m pytest -q --junitxml=shutdown-results.xml
          tests/test_shutdown_signals.py
          tests/test_live_devfee_router.py::LiveDevFeeRouterTests::test_sigterm_closes_live_aggregate_miner_and_dashboard_stream
          tests/test_live_devfee_router.py::LiveDevFeeRouterTests::test_sigterm_closes_during_fee_window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shutdown-results-python312
          path: shutdown-results.xml
